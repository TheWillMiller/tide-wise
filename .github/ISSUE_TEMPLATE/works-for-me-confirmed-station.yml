name: Works For Me / Confirmed Station
description: Confirm a TideWise install and provider/station/entity that works.
title: "[Works For Me]: "
labels:
  - works-for-me
  - confirmed-station
body:
  - type: input
    id: tidewise_version
    attributes:
      label: TideWise version
      placeholder: v0.4.7
    validations:
      required: true
  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: hacs_version
    attributes:
      label: HACS version
    validations:
      required: false
  - type: dropdown
    id: provider
    attributes:
      label: Tide provider
      options:
        - US NOAA CO-OPS
        - Canada CHS / DFO
        - UK UKHO Tides integration sensor
        - Home Assistant tide entity
        - Other
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Station, sensor entity, or source
      placeholder: "8661070 / sensor.portsmouth_tide / sensor.adriatic_tide_predictions"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Location/general area
      placeholder: Cherry Grove, SC / Portsmouth, UK / Adriatic Sea / Sydney, AU
    validations:
      required: true
  - type: input
    id: prediction_attribute
    attributes:
      label: Prediction attribute name
      description: For Home Assistant tide entity reports, name the attribute TideWise reads. Leave blank for NOAA/CHS/UKHO.
      placeholder: predictions / tide_predictions / events / extremes
    validations:
      required: false
  - type: input
    id: browser_device
    attributes:
      label: Browser/device
    validations:
      required: true
  - type: dropdown
    id: install_method
    attributes:
      label: Install method
      options:
        - HACS custom repository
        - Manual local resource
        - CDN test resource
        - Other
    validations:
      required: true
  - type: textarea
    id: optional_entities
    attributes:
      label: Optional entities used
      description: List weather, water temp, surf, rip current, wind, pressure, or rain entities if used. Write "none" if not.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes or screenshot
      description: Optional screenshot or notes about what worked.
    validations:
      required: false
